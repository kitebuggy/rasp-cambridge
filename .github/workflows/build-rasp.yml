name: Build RASP Cambridge calendar

on:
  schedule:
    # ONE cron, hourly, round the clock.  All UTC: GitHub Actions cron
    # is UTC-only with no DST awareness, and RASP's own regen is UTC too,
    # so nothing here needs a DST adjustment.  The local times drift by
    # an hour at the clock change and that is fine.
    #
    # It ran 05-17 UTC until 2026-08-06.  Widened to 24h because the
    # 05:xx and 06:xx slots were dropped every single day for six days,
    # so the early-bird build Jason actually wants never happened.  More
    # slots in the pre-dawn window is the only cheap way to get a chance
    # at one.  Overnight slots that find nothing to do cost ~10 seconds.
    #
    # NOTE ON THE MINUTE: :45, not :00.  GitHub queues scheduled runs on
    # shared infrastructure, dispatches them late under load, and DROPS
    # them outright when load is high enough.  History: :00 until
    # 2026-07-30 (delays of 1, 16, 26, 49, 51 min; 3 of 8 slots never
    # fired), then :23, then :13, now :45 - chosen 2026-08-06 on the
    # theory that the contention window sits around the top of the hour
    # and the far side of it is the cheapest place to be.
    #
    # Caveat, recorded so nobody re-litigates it: :45 IS one of the
    # quarter-hours that the earlier reasoning tried to avoid, and none
    # of the three previous minutes measurably beat the others.  This is
    # a cheap experiment, not a fix - see the paragraph below.
    #
    # Do NOT treat the minute as the fix.  The same measurement showed
    # the delay pattern repeating to within +/-3 minutes on consecutive
    # days, so it tracks global cron load, not jitter - an unpopular
    # minute only shaves the edge off.  What makes this reliable is the
    # max-age rule in the decide step: every slot is another chance to
    # notice the published data is stale, so no single firing is
    # load-bearing.
    #
    # Measured delivery on this schedule, 2026-08-04..06: about 5 of 13
    # slots arrived per day, spaced 136-180 min apart - NOT hourly.  Size
    # MAX_AGE_MIN below that minimum gap or it silently skips alternate
    # runs; see the note on it below.
    #
    # There is deliberately no anchor/recheck split any more.  It used to
    # be three unconditional "anchor" crons plus one conditional hourly
    # line, with the decide step telling them apart by parsing
    # github.event.schedule.  Two problems, both now gone: a dropped
    # anchor was uncompensated (the next recheck saw complete state and
    # skipped, so the volatile UK4 "today" curve stayed stale until the
    # following anchor), and the classification was a silent trap for
    # anyone editing the schedule - merging the anchors onto one line
    # would have reclassified them.  Max-age subsumes both jobs and needs
    # no classification at all, so the schedule is now safe to edit.
    - cron: "45 * * * *"
  workflow_dispatch:   # Allow manual runs from the Actions tab.
  push:
    branches: [main]
    paths:
      - "rasp_stars.py"
      - "requirements.txt"
      - ".github/workflows/build-rasp.yml"

# Least privilege: default everything to read-only here and grant the extra
# scopes per job.  Only `build` needs contents:write (it commits
# build_state.json); `deploy` gets pages/id-token and nothing else.  A
# workflow-level contents:write would hand write access to the repo to
# every job that ever gets added, including ones that only publish.
permissions:
  contents: read

# Avoid two scheduled runs racing if one is slow.
concurrency:
  group: build-rasp
  cancel-in-progress: false

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 used to live here.  It was a
# pre-cut-over opt-in; GitHub-hosted runners default to Node 24 as of
# 2026-06-16, so it no longer does anything and has been removed.  Every
# action below is now pinned to a major that declares node24 natively,
# which is what actually silences the deprecation warnings - the env var
# only forced node20 actions onto the newer runtime, it did not make them
# node24 actions.  Do NOT reach for ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION
# to quieten anything: it pins execution back to Node 20 and stops working
# when Node 20 is removed from the runners in autumn 2026.

# Every action is pinned to a full commit SHA, not a tag.  Tags are
# mutable: `@v7` can be force-moved to any commit by whoever controls the
# repo, and these actions run with this workflow's token.  The trailing
# comment records the human-readable version, and .github/dependabot.yml
# raises a PR when a pin falls behind - without which SHA pinning just
# means quietly running stale code forever.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # commits public/build_state.json back to main
    outputs:
      rebuilt: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether a rebuild is needed
        id: decide
        # Rebuild if ANY of these holds:
        #
        #     this is not a scheduled run (push or manual)
        #     there is no state file yet
        #     the state file is for a different UTC day
        #     the last run did not get all seven days
        #     the data we already have is older than MAX_AGE_MIN
        #
        # Otherwise exit here in a couple of seconds.  On a normal day
        # that means four builds and nine cheap no-ops.
        #
        # The rule deliberately does NOT look at which cron woke it.  An
        # earlier version split the schedule into unconditional "anchor"
        # crons and conditional "recheck" crons and told them apart by
        # parsing github.event.schedule - see git history.  It worked,
        # but a dropped anchor was uncompensated: the next recheck saw
        # complete state, skipped, and the volatile UK4 "today" curve
        # stayed stale until the following anchor.  Worse, the whole
        # thing turned on an unwritten invariant about how the cron
        # expressions were formatted, so editing the schedule could
        # silently invert the behaviour.
        #
        # Age subsumes both jobs.  Staleness is the thing we actually
        # care about, so measure it directly rather than inferring it
        # from the timetable - which GitHub does not honour anyway.
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATE: public/build_state.json
          # MAX_AGE_MIN is now only a DEBOUNCE, not the freshness policy.
          # Freshness moved into the FRESHNESS table in rasp_stars.py,
          # which decides per forecast day how old a chart may get before
          # it is re-fetched and before it stops being publishable.  Today
          # and tomorrow are re-fetched on every build, so there is no
          # longer any build-level "too fresh to bother" state.
          #
          # What survives here is a floor to stop a burst of scheduler
          # deliveries hammering RASP: 45 minutes is under the smallest
          # gap ever observed between real runs (136 min), so in practice
          # it never binds - it exists for the day GitHub decides to give
          # us all 24 slots at once.
          #
          # Do NOT grow this back into a freshness knob.  It was 180 for
          # three days and silently halved the build rate; the reason that
          # was possible is that a single global number cannot express
          # "today matters more than next Tuesday".
          MAX_AGE_MIN: "45"
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            decision=true;  reason="$EVENT_NAME run - rebuilding unconditionally"
          elif [ ! -f "$STATE" ]; then
            decision=true;  reason="no $STATE yet - rebuilding"
          else
            # '|| echo' on each so a truncated or hand-edited state file
            # forces a rebuild rather than failing the run under 'set -e'.
            run_date=$(python3 -c "import json;print(json.load(open('$STATE')).get('run_date',''))" || echo "unreadable")
            complete=$(python3 -c "import json;print(json.load(open('$STATE')).get('complete',False))" || echo "False")
            failed=$(python3 -c "import json;print(json.load(open('$STATE')).get('days_failed','?'))" || echo "?")
            # Missing/!unparseable generated_utc => 99999 => always stale.
            age_min=$(python3 -c "import json,datetime as dt;g=json.load(open('$STATE'))['generated_utc'].replace('Z','+00:00');print(int((dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(g)).total_seconds()//60))" || echo 99999)
            today=$(date -u +%F)
            if [ "$run_date" != "$today" ]; then
              decision=true;  reason="state is for $run_date, today is $today - rebuilding"
            elif [ "$complete" != "True" ]; then
              decision=true;  reason="state for $today has $failed day(s) missing - rebuilding"
            elif [ "$age_min" -ge "$MAX_AGE_MIN" ]; then
              # NOT a freshness test - see MAX_AGE_MIN above.  Which days
              # actually get re-fetched is decided per horizon by the
              # FRESHNESS table in rasp_stars.py, after this step.
              decision=true;  reason="last build ${age_min}m ago (debounce ${MAX_AGE_MIN}m) - building; per-day freshness decided in rasp_stars.py"
            else
              decision=false; reason="last build only ${age_min}m ago - debounced, min gap ${MAX_AGE_MIN}m"
            fi
          fi
          echo "build=$decision" >> "$GITHUB_OUTPUT"
          echo "$reason"
          echo "**Rebuild: $decision** - $reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # "3.14" (not "3.14.6") so setup-python resolves the newest
          # patch release each run - patch bumps are security fixes we
          # want automatically.  3.12 went security-only (source fixes,
          # no more binaries) in 2026; 3.14 is in active bugfix support
          # until October 2030.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        if: steps.decide.outputs.build == 'true'
        # The pip bundled with setup-python's interpreter lags PyPI by a
        # few weeks, so upgrade it before installing anything.  Mostly this
        # just silences pip's own "a new release is available" notice, but
        # 26.1.2 - the version shipped at the time of writing - is affected
        # by CVE-2026-13346, where pip unquoted %-escapes twice and a
        # crafted link could steer a download to an arbitrary path.
        # Exploiting it needs a malicious or compromised index, so the real
        # risk to this workflow (two well-known wheels from PyPI over TLS)
        # is slight - but the fix costs a few seconds a run.  Harmless to
        # leave in once the runner image catches up: it becomes a no-op.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prune previous build artefacts
        if: steps.decide.outputs.build == 'true'
        # Each run regenerates everything; carrying stale PNGs/CSVs from
        # previous runs would pollute the repo and the deployed Pages site.
        # Wipe the charts directory and the root ICS each time.  Note this
        # is deliberate: a day RASP cannot serve today must NOT inherit an
        # earlier run's rating.  It is republished as a "no data"
        # placeholder instead - see rasp_stars.py.  build_state.json is
        # kept, because the next run needs to read it.
        run: |
          rm -rf public/charts
          rm -f  public/cambridge_rasp.ics

      - name: Generate calendar
        if: steps.decide.outputs.build == 'true'
        run: |
          mkdir -p public/charts
          # --previous-base points the script at our own published site.
          # The Pages artifact already holds build_state.json and every
          # chart PNG, so the live site doubles as the last-known-good
          # store: when a fetch fails, the script pulls back what
          # subscribers are already being served rather than blanking the
          # day.  No cache to configure and nothing to evict.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          python rasp_stars.py \
            --out-dir ./public/charts \
            --ics ./public/cambridge_rasp.ics \
            --state ./public/build_state.json \
            --previous-base "https://${OWNER_LC}.github.io/${REPO}"

      - name: Add an index page (optional, for browsing)
        if: steps.decide.outputs.build == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          # Lowercase the owner because GitHub Pages serves from the
          # lowercased subdomain regardless of the canonical username case.
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          cat > public/index.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8">
          <title>RASP ${REPO}</title>
          <style>body{font-family:system-ui;max-width:42em;margin:2em auto;padding:0 1em}
          code{background:#f4f4f4;padding:2px 6px;border-radius:3px}</style>
          </head><body>
          <h1>RASP ${REPO} - 7-day star forecast</h1>
          <p>Subscribe to the calendar from your calendar app:</p>
          <p><code>webcal://${OWNER_LC}.github.io/${REPO}/cambridge_rasp.ics</code></p>
          <p>Or download the latest ICS:
            <a href="cambridge_rasp.ics">cambridge_rasp.ics</a></p>
          <p>Audit-trail PNG charts are in <a href="charts/">/charts</a>.</p>
          <p>Build state (which days RASP served on the last run):
            <a href="build_state.json">build_state.json</a>.</p>
          <p><em>Rebuilt through the day via GitHub Actions - refreshed
          every few hours, and retried sooner while any day is missing.
          Days RASP cannot serve appear as "no data" placeholders - never
          as an out-of-date rating.</em></p>
          </body></html>
          HTML

      - name: Commit build state
        if: steps.decide.outputs.build == 'true'
        # Deliberately NOT the ICS or the chart PNGs - .gitignore excludes
        # them.  Subscribers are served from the Pages artifact uploaded
        # below, which is tarred from the working tree and does not care
        # what git tracks.  Committing a 500 KB base64-laden ICS per
        # rebuild only bloated history.  What is committed is
        # build_state.json (the next run must be able to read it), the
        # CSVs and index.html.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          # Only commit if something actually changed.
          if git diff --cached --quiet; then
            echo "No tracked changes - state identical to last run."
          else
            git commit -m "Refresh RASP build state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload as Pages artifact
        if: steps.decide.outputs.build == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    # A skipped run uploads no artifact, so there is nothing to deploy -
    # the previous Pages deployment simply stays live.
    if: needs.build.outputs.rebuilt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
