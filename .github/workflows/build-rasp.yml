name: Build RASP Cambridge calendar

on:
  schedule:
    # NOTE ON THE MINUTE: everything fires at :23, not :00.  GitHub queues
    # scheduled runs on shared infrastructure, delays them under load, and
    # DROPS them outright when load is high enough - and the top of the
    # hour is the worst window, because that is when most of the world's
    # cron entries fire.  Measured on 2026-07-29 with every cron at :00:
    # delays of 1, 16, 26, 49 and 51 minutes, and 3 of 8 slots between
    # 10:00 and 17:00 UTC never fired at all.  An unpopular minute is the
    # single cheapest mitigation.  :23 also avoids the :00/:15/:30/:45
    # quarter-hours and multiples of 5 that */5-style schedules cluster on.
    #
    # Three ANCHOR runs - each naming a SINGLE hour, which is how the
    # decide step below tells them apart from the recheck line.  All UTC
    # (GitHub Actions cron is UTC-only with no DST awareness).  Times
    # chosen against the gliding season (BST):
    #   05:23 UTC = 06:23 BST  - early-bird view; UK4 series ready
    #   08:23 UTC = 09:23 BST  - after RASP's morning UK12 regen (~06:50 UTC)
    #   10:23 UTC = 11:23 BST  - belt-and-braces in case earlier runs missed
    # Anchors always rebuild unconditionally, so the volatile UK4 "today"
    # curve picks up RASP's intra-day reruns.
    - cron: "23 5 * * *"
    - cron: "23 8 * * *"
    - cron: "23 10 * * *"
    # RECHECK runs, hourly across the rest of the working day - one cron
    # naming MANY hours, which is what marks them as rechecks.  These are
    # conditional: the "Decide whether a rebuild is needed" step reads
    # public/build_state.json and skips the build when the previous run
    # already got all seven days for today.  They exist to shorten the
    # outage when RASP is down or mid-refresh at an anchor time - the
    # affected days publish as "no data" placeholders and are replaced
    # within the hour instead of waiting for the next anchor.  Because
    # GitHub drops scheduled runs, treat each of these as best-effort: the
    # redundancy across ten slots is what makes recovery reliable, not any
    # single one firing.
    - cron: "23 6,7,9,11,12,13,14,15,16,17 * * *"
  workflow_dispatch:   # Allow manual runs from the Actions tab.
  push:
    branches: [main]
    paths:
      - "rasp_stars.py"
      - "requirements.txt"
      - ".github/workflows/build-rasp.yml"

# Least privilege: default everything to read-only here and grant the extra
# scopes per job.  Only `build` needs contents:write (it commits
# build_state.json); `deploy` gets pages/id-token and nothing else.  A
# workflow-level contents:write would hand write access to the repo to
# every job that ever gets added, including ones that only publish.
permissions:
  contents: read

# Avoid two scheduled runs racing if one is slow.
concurrency:
  group: build-rasp
  cancel-in-progress: false

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 used to live here.  It was a
# pre-cut-over opt-in; GitHub-hosted runners default to Node 24 as of
# 2026-06-16, so it no longer does anything and has been removed.  Every
# action below is now pinned to a major that declares node24 natively,
# which is what actually silences the deprecation warnings - the env var
# only forced node20 actions onto the newer runtime, it did not make them
# node24 actions.  Do NOT reach for ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION
# to quieten anything: it pins execution back to Node 20 and stops working
# when Node 20 is removed from the runners in autumn 2026.

# Every action is pinned to a full commit SHA, not a tag.  Tags are
# mutable: `@v7` can be force-moved to any commit by whoever controls the
# repo, and these actions run with this workflow's token.  The trailing
# comment records the human-readable version, and .github/dependabot.yml
# raises a PR when a pin falls behind - without which SHA pinning just
# means quietly running stale code forever.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # commits public/build_state.json back to main
    outputs:
      rebuilt: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether a rebuild is needed
        id: decide
        # Anchor runs, manual runs and pushes always rebuild.  Recheck runs
        # only rebuild if the last run did not get a complete set of seven
        # days for today - i.e. only when there is a gap to close.  On a
        # normal day the 05:23 anchor succeeds and every recheck exits here
        # in a few seconds.
        #
        # Which kind of run this is comes from the triggering cron itself
        # (github.event.schedule reports it verbatim), so the schedule is
        # stated in exactly ONE place - the `schedule:` list above.  The
        # invariant that makes this work:
        #
        #     an ANCHOR cron names a single hour   -> "23 5 * * *"
        #     the RECHECK cron names several       -> "23 6,7,9,... * * *"
        #
        # Keep it that way when editing the schedule.  A previous version
        # kept a second copy of the recheck expression here and compared
        # the two strings; the copies only had to drift by one character
        # for every recheck to silently become an unconditional rebuild -
        # 13 full rebuilds a day instead of 3, with nothing failing to
        # show it.  Deriving it removes that failure mode entirely.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          STATE: public/build_state.json
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            kind="$EVENT_NAME"
          else
            # Field 2 of the cron expression is the hour list.
            case "$(printf '%s' "$EVENT_CRON" | awk '{print $2}')" in
              *,*|*-*|*/*) kind=recheck ;;
              *)           kind=anchor  ;;
            esac
          fi
          if [ "$kind" != "recheck" ]; then
            decision=true;  reason="$kind run - rebuilding unconditionally"
          elif [ ! -f "$STATE" ]; then
            decision=true;  reason="no $STATE yet - rebuilding"
          else
            # '|| echo' so a truncated or hand-edited state file forces a
            # rebuild rather than failing the run under 'set -e'.
            run_date=$(python3 -c "import json;print(json.load(open('$STATE')).get('run_date',''))" || echo "unreadable")
            complete=$(python3 -c "import json;print(json.load(open('$STATE')).get('complete',False))" || echo "False")
            failed=$(python3 -c "import json;print(json.load(open('$STATE')).get('days_failed','?'))" || echo "?")
            today=$(date -u +%F)
            if [ "$run_date" = "$today" ] && [ "$complete" = "True" ]; then
              decision=false; reason="last run covered $today with all 7 days - nothing to recheck"
            else
              decision=true;  reason="last run was for $run_date with $failed day(s) missing - rechecking"
            fi
          fi
          echo "build=$decision" >> "$GITHUB_OUTPUT"
          echo "$reason"
          echo "**Rebuild: $decision** - $reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # "3.14" (not "3.14.6") so setup-python resolves the newest
          # patch release each run - patch bumps are security fixes we
          # want automatically.  3.12 went security-only (source fixes,
          # no more binaries) in 2026; 3.14 is in active bugfix support
          # until October 2030.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        if: steps.decide.outputs.build == 'true'
        # The pip bundled with setup-python's interpreter lags PyPI by a
        # few weeks, so upgrade it before installing anything.  Mostly this
        # just silences pip's own "a new release is available" notice, but
        # 26.1.2 - the version shipped at the time of writing - is affected
        # by CVE-2026-13346, where pip unquoted %-escapes twice and a
        # crafted link could steer a download to an arbitrary path.
        # Exploiting it needs a malicious or compromised index, so the real
        # risk to this workflow (two well-known wheels from PyPI over TLS)
        # is slight - but the fix costs a few seconds a run.  Harmless to
        # leave in once the runner image catches up: it becomes a no-op.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prune previous build artefacts
        if: steps.decide.outputs.build == 'true'
        # Each run regenerates everything; carrying stale PNGs/CSVs from
        # previous runs would pollute the repo and the deployed Pages site.
        # Wipe the charts directory and the root ICS each time.  Note this
        # is deliberate: a day RASP cannot serve today must NOT inherit an
        # earlier run's rating.  It is republished as a "no data"
        # placeholder instead - see rasp_stars.py.  build_state.json is
        # kept, because the next recheck needs to read it.
        run: |
          rm -rf public/charts
          rm -f  public/cambridge_rasp.ics

      - name: Generate calendar
        if: steps.decide.outputs.build == 'true'
        run: |
          mkdir -p public/charts
          python rasp_stars.py \
            --out-dir ./public/charts \
            --ics ./public/cambridge_rasp.ics \
            --state ./public/build_state.json

      - name: Add an index page (optional, for browsing)
        if: steps.decide.outputs.build == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          # Lowercase the owner because GitHub Pages serves from the
          # lowercased subdomain regardless of the canonical username case.
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          cat > public/index.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8">
          <title>RASP ${REPO}</title>
          <style>body{font-family:system-ui;max-width:42em;margin:2em auto;padding:0 1em}
          code{background:#f4f4f4;padding:2px 6px;border-radius:3px}</style>
          </head><body>
          <h1>RASP ${REPO} - 7-day star forecast</h1>
          <p>Subscribe to the calendar from your calendar app:</p>
          <p><code>webcal://${OWNER_LC}.github.io/${REPO}/cambridge_rasp.ics</code></p>
          <p>Or download the latest ICS:
            <a href="cambridge_rasp.ics">cambridge_rasp.ics</a></p>
          <p>Audit-trail PNG charts are in <a href="charts/">/charts</a>.</p>
          <p>Build state (which days RASP served on the last run):
            <a href="build_state.json">build_state.json</a>.</p>
          <p><em>Regenerated at 05:23, 08:23 and 10:23 UTC via GitHub
          Actions, then rechecked hourly at :23 past until 17:23 UTC, or
          until all seven days are available. Days RASP cannot serve appear
          as "no data" placeholders - never as an out-of-date rating.</em></p>
          </body></html>
          HTML

      - name: Commit build state
        if: steps.decide.outputs.build == 'true'
        # Deliberately NOT the ICS or the chart PNGs - .gitignore excludes
        # them.  Subscribers are served from the Pages artifact uploaded
        # below, which is tarred from the working tree and does not care
        # what git tracks.  Committing a 500 KB base64-laden ICS per
        # rebuild only bloated history.  What is committed is
        # build_state.json (the next recheck must be able to read it), the
        # CSVs and index.html.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          # Only commit if something actually changed.
          if git diff --cached --quiet; then
            echo "No tracked changes - state identical to last run."
          else
            git commit -m "Refresh RASP build state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload as Pages artifact
        if: steps.decide.outputs.build == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    # A skipped recheck uploads no artifact, so there is nothing to deploy -
    # the previous Pages deployment simply stays live.
    if: needs.build.outputs.rebuilt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
